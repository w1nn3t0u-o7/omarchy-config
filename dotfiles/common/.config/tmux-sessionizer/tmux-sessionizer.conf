# tmux-sessionizer configuration
# Sourced by ~/.local/bin/tmux-sessionizer.

# Project directories searched by the fzf picker.
# A ":N" suffix sets the find depth for that path, otherwise TS_MAX_DEPTH is used.
TS_SEARCH_PATHS=("$HOME/Projects:2")
TS_MAX_DEPTH=1

# Windows created in every session, in order, as "name:command".
# An empty command opens a scratch shell in the project directory.
TS_WINDOWS=(
  "nvim:nvim"
  "pi:pi"
  "term:"
  "lazygit:lazygit"
)
