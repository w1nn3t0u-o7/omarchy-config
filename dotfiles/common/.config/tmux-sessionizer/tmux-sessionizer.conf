# tmux-sessionizer configuration
# Sourced by ~/.local/bin/tmux-sessionizer to override its built-in defaults.

# Where the picker finds projects.
#   path:N  scan for project directories under path, up to N levels deep
#   path:0  add exactly that directory (no scanning)
TS_SEARCH_PATHS=(
  "$HOME/Projects"
  "$HOME/Documents/vault:0"
)

# Other built-in defaults, override by uncommenting:
# TS_MAX_DEPTH=1
TS_WINDOWS=("nvim:nvim" "pi:pi" "term:" "lazygit:lazygit")
